name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product target (shell integration, HDR on DX12).
        # Linux keeps the core portable: winit and wgpu run there, so a port
        # stays possible and cross-platform breakage surfaces early.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (winit/wgpu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      # `rav1d` assembles its own hand-written kernels and does not compile at
      # all without NASM — not "falls back to a slower path", does not build.
      - name: Install NASM (rav1d, for AVIF)
        uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      # The release build passes --locked, so a version bump that forgets to
      # update Cargo.lock only fails after the tag is pushed — when the
      # publication is already irreversible. Catch it here instead.
      - name: Lockfile is in step with the manifest
        run: cargo metadata --locked --format-version 1 > /dev/null
        shell: bash
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # rust-version is a promise to anyone building from source. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used — so read it from the manifest and hold it to it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      # `rav1d` assembles its own hand-written kernels and does not compile at
      # all without NASM — not "falls back to a slower path", does not build.
      - name: Install NASM (rav1d, for AVIF)
        uses: ilammy/setup-nasm@v1
      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --all-targets
