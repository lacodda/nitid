name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product target (shell integration, HDR on DX12).
        # Linux keeps the core portable: winit and wgpu run there, so a port
        # stays possible and cross-platform breakage surfaces early.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (winit/wgpu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      # The release build passes --locked, so a version bump that forgets to
      # update Cargo.lock only fails after the tag is pushed — when the
      # publication is already irreversible. Catch it here instead.
      - name: Lockfile is in step with the manifest
        run: cargo metadata --locked --format-version 1 > /dev/null
        shell: bash
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
