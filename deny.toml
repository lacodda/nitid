# What `cargo deny check` holds the dependency graph to, in the audit workflow:
# no crate with a published advisory, no license outside the list below,
# nothing fetched from outside crates.io.
#
# Dependabot is off on purpose (docs/adr/0046-dependabot-is-off.md); this file
# is the half of it that stays.

[advisories]
# An unmaintained crate is reported when this project depends on it directly.
# Deep in the tree it is the direct dependency's to replace, and a red build
# nobody here can fix teaches people to ignore red builds.
unmaintained = "workspace"
yanked = "deny"
# An advisory accepted on purpose goes here, with the reason next to it:
# { id = "RUSTSEC-0000-0000", reason = "no fixed release yet; the affected function is never called" },
ignore = [
    # Both are in quick-xml 0.37, which little_exif 0.6.23 - its newest release -
    # still asks for. little_exif reads XML in one place: the XMP of a PNG it is
    # about to rewrite, when a person saves a turn or a mark into that PNG.
    # Looking at a picture never reaches it, and neither does the decoder's
    # process. Gone with the first little_exif on quick-xml 0.41.
    { id = "RUSTSEC-2026-0194", reason = "quadratic time on a start tag with many attributes: a crafted PNG can make saving a mark into it slow, and nothing else" },
    { id = "RUSTSEC-2026-0195", reason = "in NsReader, which little_exif does not use: it reads with the plain Reader" },
]

[licenses]
# Permissive licenses, and MPL-2.0, whose copyleft stops at the file it is in.
# A crate under anything else is a decision rather than a dependency to add
# quietly: allow its license here and say why, or choose another crate.
# `tools/check-licenses.mjs` holds npm packages to the same list, where there
# are any.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The fonts egui draws the interface with, compiled into the program by this
# one crate: Ubuntu Light and Noto Emoji, under the licenses fonts come with. Both
# allow a font to be embedded and shipped. Allowed for this crate rather than
# in the list above, so a font arriving by some other road is still a decision.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]
# The list is a policy, not an inventory of today's tree.
unused-allowed-license = "allow"
confidence-threshold = 0.93

[bans]
# Two versions of one crate are the normal state of a tree this size, not a
# defect; `deny` below is where a crate refused outright would go.
multiple-versions = "allow"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
