[package]
name = "nitid"
version = "0.23.0"
edition = "2024"
rust-version = "1.95"
description = "A fast image viewer for Windows with honest color and HDR: first pixels in milliseconds, ICC on the GPU, modern formats"
license = "MIT"
repository = "https://github.com/lacodda/nitid"
homepage = "https://github.com/lacodda/nitid"
readme = "README.md"
keywords = ["image-viewer", "hdr", "color-management", "gui", "windows"]
categories = ["multimedia::images", "graphics"]
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
# assets/icon.ico is required by build.rs on Windows; the rest of the brand
# artwork only serves GitHub and the docs site.
exclude = [
    "docs/",
    ".github/",
    "cliff.toml",
    "rustfmt.toml",
    "assets/social-preview.png",
    "assets/logo-512.png",
    "assets/apple-touch-icon.png",
    "assets/favicon-32.png",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_Security_Isolation", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices"] }
# The  macro writes its generated code against a crate literally
# named , so the crate  re-exports has to be a direct
# dependency here as well: without it the COM objects the drag source needs
# will not expand. Same version as the one  carries.
windows-core = "0.62"
windows-registry = "0.6"

[dependencies]
anyhow = "1"
thiserror = "2"

# Window and GPU: nitid owns the swapchain — HDR on Windows requires
# Bt2100Pq on Rgb10a2Unorm, which a framework-managed surface cannot express.
winit = "0.30"
wgpu = "30"
pollster = "1"

# Decoders, all pure Rust: a malformed file costs a panic, never code
# execution. HEIC included — see `docs/adr/0007-heic-decodes-in-rust.md`, which
# records why the sandbox built in v0.6.0 stays empty for it.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
zune-jpeg = "0.5"
# `moxcms` so jxl-oxide manages colour with the same engine as the rest of the
# viewer rather than pulling in a second one.
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }
# HEIC: the ISOBMFF container plus HEVC, with no C dependency and so no
# toolchain beyond cargo — the alternatives all need vcpkg, meson or libclang
# to build at all. It delivers sRGB rather than the file's own primaries, which
# is a real limitation and is written down in ADR 0007.
heif-oxide = "0.1.0"
# AVIF, in two halves: `avif-parse` reads the container, `rav1d` decodes the
# AV1 payload. `rav1d` is dav1d translated to Rust by the ISRG, so the format
# whose C decoders were the reason for the sandbox does not need one — see
# `docs/adr/0008-avif-decodes-with-rav1d.md`. It is the one dependency that
# needs a build tool: NASM, without which the crate does not compile at all.
rav1d = "1.1.0"
avif-parse = "2.1"

# Metadata
# The interface: toolbar, status line, key sheet, toasts. `egui` draws into
# nitid's own render pass rather than owning the surface — the swapchain has to
# stay ours for HDR (ADR 0001), and `eframe` would configure it itself.
#
# 0.36 is the first release built against wgpu 30, and it is what raised the
# MSRV to 1.95: the alternatives were holding wgpu back to 29 or drawing every
# widget by hand.
# `default_fonts` is the only default kept: without a font egui draws no
# text at all, and the interface is almost entirely text.
egui = { version = "0.36.1", default-features = false, features = ["default_fonts"] }
egui-wgpu = "0.36.1"
# `default-features = false` drops accessibility (`accesskit`) and the
# X11/Wayland backends; `clipboard` is taken back because the Info panel copies
# a field on click, which is what makes a coordinate or a lens name useful
# rather than only visible. The full clipboard — the image itself, the path —
# is still its own version later.
egui-winit = { version = "0.36.1", default-features = false, features = ["clipboard"] }

kamadak-exif = "0.6"
bytemuck = { version = "1.25.2", features = ["derive"] }
moxcms = "0.9"
flate2 = "1.1.9"
half = { version = "2.7.1", features = ["bytemuck"] }
image-webp = "0.2"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }

[dev-dependencies]
flate2 = "1.1.9"
# The same narrow feature set as the main dependency: the default brings in
# every decoder the crate knows, which the tests have no use for.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Fixtures for the JPEG XL tests, from an implementation independent of the
# decoder they exercise. AGPL, and a test-only dependency for that reason: it
# is never linked into the viewer and never reaches anyone installing it.
jxl-encoder = { version = "0.3.1", default-features = false, features = ["std"] }
moxcms = "0.9"
naga = { version = "30", features = ["wgsl-in"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
