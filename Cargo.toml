[package]
name = "nitid"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "A fast image viewer for Windows with honest color and HDR: first pixels in milliseconds, ICC on the GPU, modern formats"
license = "MIT"
repository = "https://github.com/lacodda/nitid"
homepage = "https://github.com/lacodda/nitid"
readme = "README.md"
keywords = ["image-viewer", "hdr", "color-management", "gui", "windows"]
categories = ["multimedia::images", "graphics"]
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
# assets/icon.ico is required by build.rs on Windows; the rest of the brand
# artwork only serves GitHub and the docs site.
exclude = [
    "docs/",
    ".github/",
    "cliff.toml",
    "rustfmt.toml",
    "assets/social-preview.png",
    "assets/logo-512.png",
    "assets/apple-touch-icon.png",
    "assets/favicon-32.png",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp"] }
windows-registry = "0.6"

[dependencies]
anyhow = "1"
thiserror = "2"

# Window and GPU: nitid owns the swapchain — HDR on Windows requires
# Bt2100Pq on Rgb10a2Unorm, which a framework-managed surface cannot express.
winit = "0.30"
wgpu = "30"
pollster = "1"

# Decoders (pure Rust; C-backed HEIC/AVIF arrive in v0.5.0 behind a sandbox)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
zune-jpeg = "0.5"
# `moxcms` so jxl-oxide manages colour with the same engine as the rest of the
# viewer rather than pulling in a second one.
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }

# Metadata
kamadak-exif = "0.6"
bytemuck = { version = "1.25.2", features = ["derive"] }
moxcms = "0.9"
flate2 = "1.1.9"
half = { version = "2.7.1", features = ["bytemuck"] }
image-webp = "0.2"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }

[dev-dependencies]
flate2 = "1.1.9"
# The same narrow feature set as the main dependency: the default brings in
# every decoder the crate knows, which the tests have no use for.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Fixtures for the JPEG XL tests, from an implementation independent of the
# decoder they exercise. AGPL, and a test-only dependency for that reason: it
# is never linked into the viewer and never reaches anyone installing it.
jxl-encoder = { version = "0.3.1", default-features = false, features = ["std"] }
moxcms = "0.9"
naga = { version = "30", features = ["wgsl-in"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
